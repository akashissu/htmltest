<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streaming Homepage</title>
    <link rel="stylesheet" href="styles-streaming.css">
</head>
<body>
    <header class="featured-banner">
        <h1>Featured Movie</h1>
        <p>The best movie to watch this week!</p>
    </header>
    <main>
        <section class="categories">
            <h2>Action</h2>
            <div class="movie-cards">
                <article class="movie-card">
                    <img src="action1.jpg" alt="Action Movie 1">
                    <h3>Action Movie 1</h3>
                </article>
                <article class="movie-card">
                    <img src="action2.jpg" alt="Action Movie 2">
                    <h3>Action Movie 2</h3>
                </article>
            </div>
        </section>
        <section class="categories">
            <h2>Comedy</h2>
            <div class="movie-cards">
                <article class="movie-card">
                    <img src="comedy1.jpg" alt="Comedy Movie 1">
                    <h3>Comedy Movie 1</h3>
                </article>
                <article class="movie-card">
                    <img src="comedy2.jpg" alt="Comedy Movie 2">
                    <h3>Comedy Movie 2</h3>
                </article>
            </div>
        </section>
    </main>
</body>
</html>
