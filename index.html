<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streaming Homepage</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="hero-banner">
        <div class="banner-content">
            <h1>Featured Movie</h1>
            <p>Start streaming now!</p>
            <button>Play</button>
        </div>
    </header>
    <section class="categories">
        <h2>Trending</h2>
        <div class="movie-grid">
            <div class="movie-card">Movie 1</div>
            <div class="movie-card">Movie 2</div>
            <div class="movie-card">Movie 3</div>
            <!-- More movie cards -->
        </div>
    </section>
    <section class="categories">
        <h2>New Releases</h2>
        <div class="movie-grid">
            <div class="movie-card">Movie 4</div>
            <div class="movie-card">Movie 5</div>
            <div class="movie-card">Movie 6</div>
            <!-- More movie cards -->
        </div>
    </section>
</body>
</html>
