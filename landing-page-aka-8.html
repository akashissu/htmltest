<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Destination AKA-8</title>
    <link rel="stylesheet" href="styles-aka-8.css">
</head>

        <h1>Discover Your Next Adventure</h1>

            <article class="destination-card">
                <img src="destination1.jpg" alt="Beautiful Beach">

                <p>Relax on serene sandy beaches with azure waters.</p>
                <button>Book Now</button>
            </article>
            <article class="destination-card">
                <img src="destination2.jpg" alt="Spectacular Mountains">

                <button>Book Now</button>
            </article>
        </section>
    </main>

</html>
