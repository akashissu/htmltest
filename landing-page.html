<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Landing Page</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <section class="hero">
        <h1>Welcome to Our Course</h1>
        <p>Empower your skills with us.</p>
    </section>
    <section class="highlights">
        <h2>Course Highlights</h2>
        <ul>
            <li>Extensive Curriculum</li>
            <li>Expert Instructors</li>
            <li>Flexible Learning Schedule</li>
        </ul>
    </section>
    <section class="instructors">
        <h2>Meet Our Instructors</h2>
        <div class="instructor-card">
            <img src="instructor1.jpg" alt="Instructor Image">
            <p>Instructor Name</p>
        </div>
        <div class="instructor-card">
            <img src="instructor2.jpg" alt="Instructor Image">
            <p>Instructor Name</p>
        </div>
    </section>
    <button class="enroll-button">Enroll Now</button>
</body>
</html>
