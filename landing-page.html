<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Destination</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="hero">
        <h1>Explore the World</h1>
        <p>Your adventure begins here!</p>
    </header>
    <main>
        <section class="destinations">
            <article class="destination-card">
                <img src="destination1.jpg" alt="Destination 1">
                <h2>Beautiful Beach</h2>
                <p>Enjoy the serene beaches with crystal clear waters.</p>
                <button>Book Now</button>
            </article>
            <article class="destination-card">
                <img src="destination2.jpg" alt="Destination 2">
                <h2>Majestic Mountains</h2>
                <p>Experience breathtaking mountain landscapes.</p>
                <button>Book Now</button>
            </article>
        </section>
    </main>
</body>
</html>
